__def("utils/format", function (module, exports, __req) {
function pad(n) {
  return n < 10 ? '0' + n : '' + n;
}

// 金额：整数不显示小数，非整数保留两位
function yuan(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return Number.isInteger(v) ? String(v) : v.toFixed(2);
}

function dateStr(ts) {
  const d = new Date(ts || Date.now());
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function timeStr(ts) {
  const d = new Date(ts || Date.now());
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function dateTime(ts) {
  return dateStr(ts) + ' ' + timeStr(ts);
}

function shortDate(ts) {
  const d = new Date(ts || Date.now());
  return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function maskPhone(phone) {
  const s = String(phone || '');
  return s.length === 11 ? s.slice(0, 3) + '****' + s.slice(7) : s;
}

// 生成订单号：JB + 年月日 + 时分 + 2 位随机
function orderNo() {
  const d = new Date();
  return (
    'JB' +
    d.getFullYear() +
    pad(d.getMonth() + 1) +
    pad(d.getDate()) +
    pad(d.getHours()) +
    pad(d.getMinutes()) +
    pad(Math.floor(Math.random() * 90) + 10)
  );
}

module.exports = { yuan, dateStr, timeStr, dateTime, shortDate, maskPhone, orderNo, pad };

__def("utils/size", function (module, exports, __req) {
/* 挑码：这款校服的尺码就是身高（150/155/…/200），所以只按身高挑，不算体重、不算 BMI。
   纯函数，不碰 storage，方便 preview/flow-test.js 直接测。
   规则：
     1. 商品尺码是数字（150/155/…）时，取和身高最接近的那一档；
     2. 身高比最小码还矮 / 比最大码还高，给最小码 / 最大码，并说明；
     3. 身高卡在两档中间（离两档一样近），按「拿不准选大一码」给大的一档；
     4. 单尺码（均码）直接给那一个；
     5. 尺码是字母（老数据）时退回按次序找，只提示看表，不再算体重。 */
'use strict';

const LETTER_AS_HEIGHT = {
  XXS: 145, XS: 150, S: 158, M: 165, L: 172, XL: 180, XXL: 188, XXXL: 195
};

function toNumber(v) {
  if (v === '' || v === null || v === undefined) return NaN;
  const n = Number(String(v).replace(/[^\d.]/g, ''));
  return isFinite(n) ? n : NaN;
}

function isNumericSize(s) {
  return /^\d{3}$/.test(String(s));
}

/* 尺码表 → 身高刻度表，例如 ['150','155'] → [{size:'150',h:150}, ...] */
function buildBands(sizes) {
  return (sizes || []).map(function (size) {
    if (isNumericSize(size)) return { size: size, h: Number(size) };
    const h = LETTER_AS_HEIGHT[String(size).toUpperCase()];
    return { size: size, h: h || 165 };
  });
}

/* 身高 → 最接近的一档；返回 {index, diff, out}
   out: -1 矮于最小码，1 高于最大码，0 正常 */
function bandOfHeight(bands, h) {
  let best = 0;
  let bestDiff = Infinity;
  for (let i = 0; i < bands.length; i += 1) {
    const d = Math.abs(bands[i].h - h);
    if (d < bestDiff) {
      bestDiff = d;
      best = i;
    }
  }
  if (h < bands[0].h) return { index: 0, diff: bands[0].h - h, out: -1 };
  if (h > bands[bands.length - 1].h) {
    return { index: bands.length - 1, diff: h - bands[bands.length - 1].h, out: 1 };
  }
  return { index: best, diff: bestDiff, out: 0 };
}

/* product = 商品对象；height 可以是输入框原样传进来的字符串 */
function recommend(product, height) {
  if (!product || !product.sizes || !product.sizes.length) {
    return { ok: false, msg: '这件商品没有尺码信息' };
  }
  const sizes = product.sizes;
  if (sizes.length === 1) {
    return {
      ok: true,
      size: sizes[0],
      index: 0,
      adjusted: 0,
      note: '这款只有一个尺码（' + sizes[0] + '），不用挑。'
    };
  }

  const h = toNumber(height);
  if (!isFinite(h) || h < 90 || h > 220) {
    return { ok: false, msg: '身高填 90–220cm。' };
  }

  const bands = buildBands(sizes);
  const at = bandOfHeight(bands, h);
  let idx = at.index;
  const notes = [];

  if (at.out === -1) {
    notes.push('这款最小是 ' + bands[0].size + ' 码（适合 ' + bands[0].h + 'cm 左右），先按最小码');
  } else if (at.out === 1) {
    const last = bands[bands.length - 1];
    notes.push('这款最大是 ' + last.size + ' 码（适合 ' + last.h + 'cm 左右），再高就得定制');
  } else if (at.diff === 0) {
    notes.push('正好有 ' + h + ' 码');
  } else if (at.diff <= 2.5) {
    notes.push('和 ' + bands[idx].h + ' 码只差 ' + at.diff + 'cm，穿这个最贴身');
  } else {
    notes.push('离 ' + bands[idx].h + ' 码最近');
  }

  /* 卡在两档正中间：按校服「拿不准选大一码」的习惯给大一档 */
  if (at.out === 0 && idx < bands.length - 1) {
    const up = bands[idx + 1];
    if (Math.abs(up.h - h) === Math.abs(bands[idx].h - h)) {
      idx += 1;

 * 设计原则：**云不可用时自动退回本地 store**，这样
 *   - 网页演示版（没有 wx.cloud）照旧双击就能走完整流程

 * 用法：

 *   if (cloudApi.ready()) {

 * 留空 = 关闭云端，全部走本地演示（网页版、没开通云的机器都靠这个）。 */

let inited = false;
let usable = false;

function available() {

}

function init() {

  inited = true;
  if (!available()) {
    usable = false;
    return usable;
  }
  try {
    wx.cloud.init({ env: ENV_ID, traceUser: true });
    usable = true;
  } catch (e) {

function call(action, data) {

    return Promise.resolve({ ok: false, msg: '还没接云端，走本地演示' });
  }

    wx.cloud.callFunction({
      name: 'api',

  });

 *
 * 为什么要这一层：
 *   - 页面不该知道「现在有没有云」，否则每页都要写 if/else
 *   - 云端一旦可用，价格、库存、权限都由云函数说了算，前端改 JS 改不动
 *   - 网页演示版 / 没开通云开发的机器照样能点完整流程
 *
 * 约定：所有函数都返回 Promise，结果形状统一为
 *   { ok: true, ...数据 }  或  { ok: false, msg: '给人看的中文原因' }

 * 只在「云函数根本没部署 / 网络断了」时退回本地；

function isTransportError(r) {
  if (!r || r.ok) return false;
  const msg = String(r.msg || '');
  return (
    msg.indexOf('调用云端失败') >= 0 ||
    msg.indexOf('还没接云端') >= 0 ||
    msg.indexOf('云端返回格式不对') >= 0 ||
    msg.indexOf('function not found') >= 0 ||
    msg.indexOf('FUNCTION_NOT_FOUND') >= 0 ||
    msg.indexOf('Environment not found') >= 0 ||
    msg.indexOf('-501000') >= 0 ||

const VERSION = 4;

const NEW_USER_POINTS = 500; // 新客礼
const MAX_DISCOUNT_RATE = 0.05; // 每单最多抵商品金额的 5%
const MEMBER_THRESHOLD = 1200; // 累计消费满 1200 元成为会员
const MEMBER_RATE = 0.96; // 会员 96 折
const FREE_SHIPPING = 50;
const EXPRESS_FEE = 8;

const STATUS = {
  pending_pay: { text: '待付款', hint: '微信支付，付完就安排' },
  paid: { text: '待发货', hint: '已付款，正在打包' },
  shipped: { text: '待收货', hint: '已发出，注意查收' },
  return_pending: { text: '退货申请中', hint: '店长正在处理，稍等一下' },
  done: { text: '已完成', hint: '感谢支持，欢迎再来' },
  cancelled: { text: '已取消', hint: '订单已取消' },
  refunded: { text: '已退货', hint: '货款已原路退回' }
};

const TABS = [
  { key: 'all', text: '全部', statuses: null },
  { key: 'pay', text: '待付款', statuses: ['pending_pay'] },
  { key: 'ship', text: '待发货', statuses: ['paid'] },
  { key: 'receive', text: '待收货', statuses: ['shipped'] },
  { key: 'done', text: '已完成', statuses: ['done', 'return_pending', 'refunded'] }
];

function now() {
  return Date.now();
}

function defaultState() {
  return {
    v: VERSION,
    user: { nickname: '', points: NEW_USER_POINTS, spent: 0 },
    pointsLog: [{ id: 'p-init', text: '新人见面礼', delta: NEW_USER_POINTS, time: now() }],
    cart: [],
    orders: [],
    address: null,
    addresses: [],
    overrides: {}
  };
}

function write(state) {
  try {
    wx.setStorageSync(KEY, state);
  } catch (e) {
    // 存储不可用时静默失败，页面仍可浏览
  }
}

function read() {
  try {
    const s = wx.getStorageSync(KEY);
    if (s && s.user && s.v === VERSION) return s;
  } catch (e) {}
  const s = defaultState();
  write(s);
  return s;
}

function ensureInit() {
  read();
}

/* ---------------- 商品 ---------------- */

function getProduct(id) {
  const p = D.PRODUCTS.find(function (x) {
    return x.id === id;
  });
  if (!p) return null;
  const s = read();
  const o = s.overrides[id] || {};
  return Object.assign({}, p, o);
}

function isOnSale(id) {
  const s = read();
  const o = s.overrides[id];
  return !(o && o.onSale === false);
}

function toggleOnSale(id) {
  const s = read();
  const cur = s.overrides[id] || {};
  const onSale = !(cur.onSale !== false);
  s.overrides[id] = Object.assign({}, cur, { onSale: onSale });
  write(s);
  return onSale;
}

/* 店长自己改价格 / 库存 / 图片 / 名称，改完只影响本机演示；
   接云开发后这里换成写数据库，图片换成云存储 fileID。 */
function updateProduct(id, patch) {
  const s = read();
  const cur = s.overrides[id] || {};
  const next = Object.assign({}, cur);
  if (patch.price !== undefined && patch.price !== '') next.price = Math.max(0, Math.round(Number(patch.price) || 0));
  if (patch.stock !== undefined && patch.stock !== '') next.stock = Math.max(0, parseInt(patch.stock, 10) || 0);
  if (patch.image) next.image = patch.image;
  if (patch.name) next.name = patch.name;
  s.overrides[id] = next;
  write(s);
  return Object.assign({}, D.PRODUCTS.find(function (p) { return p.id === id; }), next);
}

function allProducts() {
  const s = read();
  return D.PRODUCTS.map(function (p) {
    const o = s.overrides[p.id] || {};
    return Object.assign({}, p, o, { onSale: o.onSale !== false });
  });
}

function queryProducts(f) {
  f = f || {};
  let list = allProducts().filter(function (p) {
    return p.onSale;
  });
  if (f.school && f.school !== '全部') {
    list = list.filter(function (p) {
      return p.school === f.school;
    });
  }
  if (f.stage && f.stage !== '全部') {
    list = list.filter(function (p) {
      return p.stage === f.stage || p.stage === '通用';
    });
  }
  if (f.category && f.category !== '全部') {
    list = list.filter(function (p) {
      return p.category === f.category;
    });
  }
  if (f.keyword) {
    const k = String(f.keyword).trim();
    if (k) {
      list = list.filter(function (p) {
        return (p.name + p.school + p.schoolShort + p.tags.join('')).indexOf(k) >= 0;
      });
    }
  }
  if (f.sort === 'price') {
    list = list.slice().sort(function (a, b) {
      return a.price - b.price;
    });
  }
  return list;
}

function featuredProducts() {
  return D.FEATURED_IDS.map(getProduct).filter(function (p) {
    return p && isOnSale(p.id);
  });
}

/* ---------------- 积分 ---------------- */

function points() {
  const s = read();
  return {
    available: s.user.points,
    total: s.user.points
  };
}

/* 会员：累计消费满 1200 元，之后所有订单 96 折 */
function member() {
  const s = read();
  const spent = s.user.spent || 0;
  return {
    spent: spent,
    threshold: MEMBER_THRESHOLD,
    isMember: spent >= MEMBER_THRESHOLD,
    remain: Math.max(0, MEMBER_THRESHOLD - spent),
    rate: MEMBER_RATE,
    percent: Math.min(100, Math.round(spent / MEMBER_THRESHOLD * 100))
  };
}

function pointsLog() {
  return read().pointsLog;
}

function getAddress() {
  /* 老版本只存一个地址（state.address）。现在有地址簿了，
     没云的时候本地也存一份，取默认那条给结算页用。 */
  const s = read();
  const list = s.addresses || [];
  if (list.length) {
    const def = list.filter(function (a) { return a.isDefault; })[0] || list[0];
    return { name: def.name, phone: def.phone, detail: def.detail };
  }
  return s.address;
}

/* ---------------- 地址簿（本地兜底） ---------------- */

const MAX_ADDRESS = 10;

function normAddress(raw) {
  const a = raw || {};
  const name = String(a.name || '').trim();
  const phone = String(a.phone || '').trim();
  const detail = String(a.detail || '').trim();
  const tag = String(a.tag || '').trim().slice(0, 6);
  if (!name) return { ok: false, msg: '收货人姓名还没填' };
  if (name.length > 20) return { ok: false, msg: '姓名太长了吧' };
  if (!/^1\d{10}$/.test(phone)) return { ok: false, msg: '手机号要 11 位、1 开头' };
  if (detail.length < 6) return { ok: false, msg: '地址写详细点，起码到小区或门牌号' };
  if (detail.length > 120) return { ok: false, msg: '地址太长了，挑重点写' };
  return { ok: true, value: { name: name, phone: phone, detail: detail, tag: tag } };
}

function ensureDefault(list) {
  let has = false;
  list.forEach(function (x) { if (x.isDefault) has = true; });
  if (!has && list.length) list[0].isDefault = true;
  return list;
}

function getAddresses() {
  const s = read();
  return ensureDefault((s.addresses || []).slice());
}

function saveAddress(raw) {
  const parsed = normAddress(raw);
  if (!parsed.ok) return parsed;
  const s = read();
  const list = (s.addresses || []).slice();
  const wantId = raw && raw.id;
  const makeDefault = !!(raw && raw.isDefault);
  if (wantId) {
    const at = list.filter(function (x) { return x.id === wantId; })[0];
    if (!at) return { ok: false, msg: '这个地址不在你的地址簿里' };
    at.name = parsed.value.name;
    at.phone = parsed.value.phone;
    at.detail = parsed.value.detail;
    at.tag = parsed.value.tag;
    if (makeDefault) list.forEach(function (x) { x.isDefault = x.id === wantId; });
  } else {
    if (list.length >= MAX_ADDRESS) return { ok: false, msg: '地址最多存 ' + MAX_ADDRESS + ' 个，先删一个' };
    const item = {
      id: 'a' + now() + Math.floor(Math.random() * 1000),
      name: parsed.value.name,
      phone: parsed.value.phone,
      detail: parsed.value.detail,
      tag: parsed.value.tag,
      isDefault: makeDefault || list.length === 0
    };
    if (item.isDefault) list.forEach(function (x) { x.isDefault = false; });
    list.push(item);

  return { ok: true, addresses: s.addresses };

function removeAddress(id) {
  const s = read();
  const list = (s.addresses || []).filter(function (x) { return x.id !== id; });
  if (list.length === (s.addresses || []).length) return { ok: false, msg: '这个地址已经不在了' };

  write(s);
  return { ok: true, addresses: s.addresses };
}

  const s = read();
  const list = (s.addresses || []).slice();
  const at = list.filter(function (x) { return x.id === id; })[0];
  if (!at) return { ok: false, msg: '这个地址不在你的地址簿里' };
  list.forEach(function (x) { x.isDefault = x.id === id; });
  s.addresses = list;
  write(s);
  return { ok: true, addresses: list };
}

function pushLog(s, text, delta, orderId) {
  s.pointsLog.unshift({
    id: 'p' + now() + Math.floor(Math.random() * 1000),
    text: text,
    delta: delta,
    time: now(),
    orderId: orderId || ''
  });
  if (s.pointsLog.length > 60) s.pointsLog = s.pointsLog.slice(0, 60);

/* ---------------- 购物车 ---------------- */

function cartKey(productId, color, size) {
  return productId + '|' + color + '|' + size;
}

function cartCount() {
  const s = read();
  return s.cart.reduce(function (a, b) {
    return a + b.qty;
  }, 0);
}

function getCart() {
  const s = read();
  return s.cart.map(function (it) {
    const p = getProduct(it.productId);
    return p ? Object.assign({}, it, { product: p }) : null;
  }).filter(Boolean);
}

function addToCart(payload) {
  const s = read();
  const p = getProduct(payload.productId);
  if (!p) return { ok: false, msg: '商品不存在' };
  const key = cartKey(p.id, payload.color, payload.size);
  const qty = Math.max(1, parseInt(payload.qty, 10) || 1);
  const found = s.cart.find(function (i) {
    return i.key === key;
  });
  if (found) {
    found.qty = Math.min(99, found.qty + qty);
  } else {
    s.cart.push({
      key: key,
      productId: p.id,
      color: payload.color,
      size: payload.size,
      qty: qty,
      selected: true
    });
  }
  write(s);
  return { ok: true, count: cartCount() };
}

function changeQty(key, delta) {
  const s = read();
  const it = s.cart.find(function (i) {
    return i.key === key;
  });
  if (!it) return;
  it.qty = Math.max(1, Math.min(99, it.qty + delta));
  write(s);
}

function removeCart(key) {
  const s = read();
  s.cart = s.cart.filter(function (i) {
    return i.key !== key;
  });
  write(s);
}

function toggleSelect(key) {
  const s = read();
  const it = s.cart.find(function (i) {
    return i.key === key;
  });
  if (it) it.selected = !it.selected;
  write(s);
}

function selectAll(flag) {
  const s = read();
  s.cart.forEach(function (i) {
    i.selected = !!flag;
  });
  write(s);
}

function selectedCart() {
  return getCart().filter(function (i) {
    return i.selected;
  });
}

function cartSummary() {
  const list = getCart();
  let total = 0;
  let count = 0;
  list.forEach(function (i) {

    }

function removeCartKeys(keys) {

  s.cart = s.cart.filter(function (i) {

  });

/* ---------------- 订单 ---------------- */

function createOrder(payload) {
  const s = read();
  const items = (payload.items || []).map(function (it) {
    const p = getProduct(it.productId);
    if (!p) return null;
    return {
      productId: p.id,
      name: p.name,
      image: p.image,
      color: it.color,
      size: it.size,
      price: p.price,
      qty: Math.max(1, parseInt(it.qty, 10) || 1)

  }).filter(Boolean);

  if (!items.length) return { ok: false, msg: '没有可以结算的商品' };

  const goods = items.reduce(function (a, b) {
    return a + b.price * b.qty;
  }, 0);

  const delivery = payload.delivery === 'pickup' ? 'pickup' : 'express';
  const address = payload.address || {};
  if (delivery === 'express') {
    if (!address.name || !address.phone || !address.detail) {

    if (!/^1\d{10}$/.test(address.phone)) {

    }

  const available = s.user.points;
  const m = member();
  /* 会员 96 折，先减会员折扣，再按折后金额的 5% 算积分抵扣上限 */
  const memberDiscount = m.isMember ? Math.round(goods * (1 - MEMBER_RATE)) : 0;
  const maxDiscount = Math.floor((goods - memberDiscount) * MAX_DISCOUNT_RATE);
  let discount = 0;
  if (payload.usePoints) {
    discount = Math.min(maxDiscount, Math.floor(available / POINTS_PER_YUAN));
  }
  const pointsUsed = discount * POINTS_PER_YUAN;

  if (pointsUsed > available) {
    return { ok: false, msg: '积分不够抵扣，少抵一点试试' };
  }

  const amount = Math.max(0, goods - memberDiscount - discount + shipping);
  const ts = now();

  s.user.points = available - pointsUsed;
  if (pointsUsed > 0) pushLog(s, '积分抵现 ¥' + F.yuan(discount), -pointsUsed);

  const order = {
    id: 'o' + ts + Math.floor(Math.random() * 1000),
    no: F.orderNo(),
    items: items,
    goods: goods,
    shipping: shipping,
    memberDiscount: memberDiscount,
    discount: discount,
    pointsUsed: pointsUsed,
    amount: amount,
    reward: 0,
    rewardGranted: false,
    returnedItems: [],
    refundedAmount: 0,
    delivery: delivery,
    address: delivery === 'express' ? {
      name: address.name,
      phone: address.phone,
      detail: address.detail
    } : null,
    remark: payload.remark || '',
    status: 'pending_pay',
    createdAt: ts,
    updatedAt: ts,
    tracking: null,
    demo: false,
    timeline: [{ label: '订单已提交', time: ts }]
  };

  s.orders.unshift(order);
  if (delivery === 'express') {
    s.address = order.address;
  }
  write(s);

  if (payload.cartKeys && payload.cartKeys.length) {
    removeCartKeys(payload.cartKeys);
  }
  return { ok: true, order: order };
}

/* 微信支付：真实环境由云函数统一下单 + wx.requestPayment，
   支付结果以微信回调为准（前端只负责展示）。演示环境直接置为已付款。 */
function payOrder(id) {
  const s = read();
  const o = s.orders.find(function (x) {
    return x.id === id;
  });
  if (!o || o.status !== 'pending_pay') return { ok: false };
  o.status = 'paid';
  o.updatedAt = now();
  o.timeline.push({ label: '微信支付成功', time: now() });
  write(s);
  return { ok: true, order: o };
}

function getOrder(id) {
  return read().orders.find(function (o) {
    return o.id === id;
  }) || null;
}

function orderList(filter, opts) {
  opts = opts || {};
  const s = read();
  let list = s.orders.filter(function (o) {
    return opts.includeDemo ? true : !o.demo;
  });
  if (filter && filter !== 'all') {
    const tab = TABS.find(function (t) {
      return t.key === filter;
    });
    if (tab && tab.statuses) {
      list = list.filter(function (o) {
        return tab.statuses.indexOf(o.status) >= 0;
      });
    }
  }
  return list.slice().sort(function (a, b) {
    return b.createdAt - a.createdAt;
  });
}

function ship(id, company, no) {
  const s = read();
  const o = s.orders.find(function (x) {
    return x.id === id;
  });
  if (!o || o.status !== 'paid') return { ok: false };
  o.status = 'shipped';
  o.updatedAt = now();
  o.tracking = { company: company, no: no || '' };
  o.timeline.push({ label: '已发货 · ' + company + (no ? ' ' + no : ''), time: now() });
  write(s);
  return { ok: true, order: o };
}

function confirmReceipt(id) {
  const s = read();
  const o = s.orders.find(function (x) {
    return x.id === id;
  });
  if (!o || o.status !== 'shipped') return { ok: false };
  o.status = 'done';
  o.updatedAt = now();
  o.timeline.push({ label: '已确认收货', time: now() });
  /* 返积分按实付商品金额算（不含运费），取整舍去小数 */
  const base = o.amount - o.shipping;
  o.reward = Math.floor(base);
  o.rewardGranted = true;
  /* 累计消费（商品金额，不含运费）决定会员等级 */
  s.user.spent = (s.user.spent || 0) + o.goods;
  if (o.reward > 0) {
    s.user.points += o.reward;
    pushLog(s, '购物返积分', o.reward, o.id);
  }
  write(s);
  return { ok: true, order: o };
}

function cancelOrder(id) {
  const s = read();
  const o = s.orders.find(function (x) {
    return x.id === id;
  });
  if (!o || o.status !== 'pending_pay') {
    return { ok: false, msg: '已付款的订单请走退货' };
  }
  o.status = 'cancelled';
  o.updatedAt = now();
  o.timeline.push({ label: '订单已取消', time: now() });
  if (o.pointsUsed > 0) {
    s.user.points += o.pointsUsed;
    pushLog(s, '积分抵现退回', o.pointsUsed, o.id);
  }
  write(s);
  return { ok: true, order: o };
}

/* 买家申请退货（整单），等店长确认收到货后再算钱和积分 */
function requestReturn(id) {
  const s = read();
  const o = s.orders.find(function (x) {
    return x.id === id;
  });
  if (!o || o.status !== 'done') return { ok: false, msg: '确认收货后才能申请退货' };
  o.status = 'return_pending';
  o.updatedAt = now();
  o.timeline.push({ label: '买家申请退货', time: now() });
  write(s);
  return { ok: true, order: o };
}

/* 店长处理退货。indices 是要退的商品下标（可以只退其中几件）。
   规则：
   - 退的货款 = 退货商品金额 - 该部分分摊的会员折扣（运费不退）
   - 这一单用掉的积分，按退货比例退回
   - 已经返给买家的购物积分，按「实际留下金额」重算，多返的要扣回
   - 累计消费（会员额度）同步减去退货商品金额
   这样「退货的那部分不产生积分，只有真正买下的金额才送积分」。 */
function applyReturn(id, indices, reason) {
  const s = read();
  const o = s.orders.find(function (x) {
    return x.id === id;
  });
  if (!o) return { ok: false, msg: '订单不存在' };
  if (['cancelled', 'refunded'].indexOf(o.status) >= 0) return { ok: false, msg: '这单已经结束了' };

  const picked = (indices || []).filter(function (i) {
    return i >= 0 && i < o.items.length && !(o.returnedItems || []).some(function (r) { return r.index === i; });
  });
  if (!picked.length) return { ok: false, msg: '先选要退的商品' };

  const returnedGoods = picked.reduce(function (a, i) {
    return a + o.items[i].price * o.items[i].qty;
  }, 0);
  if (returnedGoods <= 0) return { ok: false, msg: '退货金额不对' };

  /* 退款按「实付商品金额」的比例退：会员折扣、积分抵扣都算进去了，运费不退 */
  const paidGoodsAll = o.amount - o.shipping;
  const refund = o.goods > 0 ? Math.round(paidGoodsAll * returnedGoods / o.goods) : 0;

  /* 这一单用掉的积分按比例退回 */
  const pointsBack = o.goods > 0 ? Math.round(o.pointsUsed * returnedGoods / o.goods) : 0;
  if (pointsBack > 0) {
    s.user.points += pointsBack;
    pushLog(s, '退货退回抵扣积分', pointsBack, o.id);
  }

  /* 已返的购物积分按实际留下的金额重算（扣掉之前已退过的部分） */
  const priorRefund = o.refundedAmount || 0;
  const paidGoods = o.amount - o.shipping; // 实付商品金额（不含运费）
  const keptGoods = Math.max(0, paidGoods - priorRefund - refund);
  if (o.rewardGranted) {
    const newReward = Math.floor(keptGoods);
    const delta = newReward - o.reward;
    if (delta !== 0) {
      s.user.points += delta;
      pushLog(s, delta > 0 ? '退货后积分补差' : '退货扣回购物积分', delta, o.id);
      o.reward = newReward;
    }
  }

  /* 会员额度同步扣减 */
  s.user.spent = Math.max(0, (s.user.spent || 0) - returnedGoods);

  picked.forEach(function (i) {
    o.returnedItems = o.returnedItems || [];
    o.returnedItems.push({ index: i, name: o.items[i].name, qty: o.items[i].qty, price: o.items[i].price });
  });

  const totalQty = o.items.reduce(function (a, b) { return a + b.qty; }, 0);
  const returnedQty = o.returnedItems.reduce(function (a, b) { return a + b.qty; }, 0);

  o.refundedAmount = (o.refundedAmount || 0) + refund;
  o.updatedAt = now();
  o.returnReason = reason || '';
  o.status = returnedQty >= totalQty ? 'refunded' : 'done';
  o.timeline.push({
    label: '已退货 ' + picked.length + ' 项 · 退款 ¥' + F.yuan(refund),
    time: now()
  });
  write(s);
  return { ok: true, order: o, refund: refund, refundedPoints: pointsBack };
}

/* ---------------- 店长端 ---------------- */

function verifyAdmin(pwd) {
  return String(pwd) === '2468';
}

function adminStats() {
  const s = read();
  const orders = s.orders;
  const pendingShip = orders.filter(function (o) { return o.status === 'paid'; }).length;
  const pendingReturn = orders.filter(function (o) { return o.status === 'return_pending'; }).length;
  const revenue = orders.filter(function (o) {
    return ['paid', 'shipped', 'done', 'return_pending', 'refunded'].indexOf(o.status) >= 0;
  }).reduce(function (a, b) {
    return a + b.amount - (b.refundedAmount || 0);
  }, 0);
  return {
    pendingShip: pendingShip,
    pendingReturn: pendingReturn,
    total: orders.length,
    revenue: revenue
  };
}

function hasDemo() {
  return read().orders.some(function (o) {
    return o.demo;
  });
}

function seedDemoOrders() {
  const s = read();
  if (hasDemo()) return 0;

  const base = now();
  const hour = 3600 * 1000;
  const specs = [
    {
      buyer: { name: '王女士', phone: '13800001234', detail: '珠海市香洲区凤凰北路 88 号 3 栋 502' },
      status: 'paid',
      ago: 2,
      items: [{ productId: 'p1', color: '藏青', size: 'L', qty: 1 }, { productId: 'p6', color: '砖红', size: '均码', qty: 2 }]
    },
    {
      buyer: { name: '陈先生', phone: '13900005678', detail: '珠海市金湾区红旗镇金海岸花园 12 栋 801' },
      status: 'shipped',
      ago: 26,
      items: [{ productId: 'p3', color: '浅蓝', size: '130', qty: 1 }]
    },
    {

      status: 'return_pending',

    }
  ];

  specs.forEach(function (spec, idx) {
    const items = spec.items.map(function (it) {
      const p = getProduct(it.productId);
      return {
        productId: p.id,
        name: p.name,
        image: p.image,
        color: it.color,
        size: it.size,
        price: p.price,
        qty: it.qty
      };
    });
    const goods = items.reduce(function (a, b) {
      return a + b.price * b.qty;
    }, 0);
    const ts = base - spec.ago * hour;
    const shipping = goods >= FREE_SHIPPING ? 0 : EXPRESS_FEE;
    const order = {
      id: 'od' + ts + idx,
      no: 'LX' + (2026111200 + idx),

      status: spec.status,

      updatedAt: ts,
      tracking: spec.status === 'shipped' || spec.status === 'return_pending' ? { company: '顺丰速运', no: 'SF' + (1000000000 + idx * 777) } : null,
      demo: true,
      timeline: [{ label: '订单已提交', time: ts }, { label: '微信支付成功', time: ts + 60 * 1000 }]
    };
    if (order.tracking) {
      order.timeline.push({ label: '已发货 · 顺丰速运 ' + order.tracking.no, time: ts + 3 * hour });
    }
    if (spec.status === 'return_pending') {
      order.timeline.push({ label: '买家申请退货', time: ts + 20 * hour });
    }
    s.orders.push(order);
  });
  write(s);
  return specs.length;
}

function clearDemoOrders() {
  const s = read();
  s.orders = s.orders.filter(function (o) {

  });

}

        remark: o.remark,

        refundText: o.refundedAmount ? '已退 ¥' + F.yuan(o.refundedAmount) : ''
      };
    });

    /* 有云端商品就用云端的（价格/库存以服务端为准），否则退回首屏的本地数据 */
    const products = (cloudGoods && cloudGoods.length) ? cloudGoods.map(mapProduct) : store.allProducts().map(mapProduct);

    /* 关键字只作用在已经算好的这一屏上，切 tab / 刷新时自动重算 */
    this.baseOrders = orders;
    const shown = orders.filter(function (o) {
      return this.matchKeyword(o, this.data.keyword);
    }.bind(this));

    this.setData({
      stats: s,
      orders: shown,
      products: products,
      lowCount: products.filter(function (p) { return p.stockLow; }).length,
      hasDemo: store.hasDemo(),
      hasMore: !!hasMore,
      picked: {},
      pickedCount: 0,
      pickedPaid: 0
    });
  },

  switchTab(e) {
    const t = e.currentTarget.dataset.t;
    this.setData({ tab: t });
    if (t === 'data') this.loadDashboard();
  },

  setFilter(e) {
    this.setData({ filter: e.currentTarget.dataset.k }, this.load);
  },

  jumpFilter(e) {
    this.setData({ tab: 'orders', filter: e.currentTarget.dataset.k }, this.load);
  },

  /* ---------- 发货 ---------- */
  openShip(e) {
    this.setData({
      shipTarget: e.currentTarget.dataset.id,
      shipCompany: '顺丰速运',
      shipNo: ''
    });
  },

  closeShip() {
    this.setData({ shipTarget: null });
  },

  pickCompany(e) {
    this.setData({ shipCompany: e.currentTarget.dataset.c });
  },

  onShipNo(e) {
    this.setData({ shipNo: e.detail.value });
  },

  /* ---------- 标记收款（家长到店付/转账，线上支付没开通时的兜底） ---------- */
  doMarkPaid(e) {
    const id = e.currentTarget.dataset.id;
    const that = this;
    const o = (this.rawMap || {})[id] || {};
    wx.showModal({
      title: '标记已收款',
      content: '确认收到这单 ¥' + (o.amountText || o.amount || '') + ' 的钱？标记后订单进入「待发货」。',
      confirmText: '收到了',
      cancelText: '还没收',
      success(res) {
        if (!res.confirm) return;
        api.markPaid(id).then(function (r) {
          if (!r || !r.ok) {
            wx.showToast({ title: (r && r.msg) || '标记失败', icon: 'none' });
            that.load();
            return;
          }
          wx.showToast({ title: '已标记收款' });
          that.load();
        });
      }
    });
  },

  doShip() {
    const id = this.data.shipTarget;
    const company = this.data.shipCompany;
    const no = this.data.shipNo.trim();
    const that = this;
    api.ship(id, company, no).then(function (r) {
      if (!r || !r.ok) {
        wx.showToast({ title: (r && r.msg) || '订单状态已变化', icon: 'none' });
        that.closeShip();
        that.load();
        return;
      }
      wx.showToast({ title: '已发货' });
      that.closeShip();
      that.load();
    });
  },

  /* ---------- 补单号 ---------- */
  openTrack(e) {
    const id = e.currentTarget.dataset.id;
    const o = (this.rawMap || {})[id] || {};
    this.setData({
      trackTarget: id,
      trackCompany: (o.tracking && o.tracking.company) || '顺丰速运',
      trackNo: ''
    });
  },

  closeTrack() {
    this.setData({ trackTarget: null });
  },

  pickTrackCompany(e) {
    this.setData({ trackCompany: e.currentTarget.dataset.c });
  },

  onTrackNo(e) {
    this.setData({ trackNo: e.detail.value });
  },

  doTrack() {
    const that = this;
    api.setTracking(this.data.trackTarget, this.data.trackCompany, this.data.trackNo.trim()).then(function (r) {
      if (!r || !r.ok) {
        wx.showToast({ title: (r && r.msg) || '保存失败', icon: 'none' });
        return;
      }
      wx.showToast({ title: '单号记上了', icon: 'none' });
      that.closeTrack();
      that.load();
    });
  },

  /* ---------- 勾选 / 批量发货 ---------- */
  togglePick(e) {
    const id = e.currentTarget.dataset.id;
    const picked = Object.assign({}, this.data.picked);
    if (picked[id]) delete picked[id];
    else picked[id] = true;
    this.refreshPicked(picked);
  },

  clearPick() {
    this.refreshPicked({});
  },

  pickAllPaid() {
    const picked = {};
    this.data.orders.forEach(function (o) {
      if (o.status === 'paid') picked[o.id] = true;
    });
    if (!Object.keys(picked).length) {
      wx.showToast({ title: '这一屏没有待发货的单', icon: 'none' });
      return;
    }
    this.refreshPicked(picked);
  },

  refreshPicked(picked) {
    const ids = Object.keys(picked);
    let paid = 0;
    const orders = this.data.orders.map(function (o) {
      const on = !!picked[o.id];
      if (on && o.status === 'paid') paid++;
      return Object.assign({}, o, { picked: on });
    });
    this.setData({ picked: picked, pickedCount: ids.length, pickedPaid: paid, orders: orders });
  },

  openBatch() {
    if (!this.data.pickedPaid) {
      wx.showToast({ title: '勾选里没有待发货的单', icon: 'none' });
      return;
    }
    this.setData({ batchOpen: true, batchCompany: '顺丰速运' });
  },

  closeBatch() {
    this.setData({ batchOpen: false });
  },

  pickBatchCompany(e) {
    this.setData({ batchCompany: e.currentTarget.dataset.c });
  },

  /* 一次发一批：同一家快递、单号可以后补（校服店常见：先打包，单号等快递员揽收才有） */
  doBatchShip() {
    const that = this;
    const picked = this.data.picked;
    const ids = Object.keys(picked).filter(function (id) {
      const raw = (that.rawMap || {})[id];
      return raw && raw.status === 'paid';
    });
    if (!ids.length) {
      wx.showToast({ title: '没有可发货的单', icon: 'none' });
      return;
    }
    wx.showModal({
      title: '批量发货 ' + ids.length + ' 单',
      content: '快递：' + this.data.batchCompany + '。单号可以稍后在订单里补。',
      success(res) {
        if (!res.confirm) return;
        wx.showLoading({ title: '发货中' });
        let done = 0;
        let failed = 0;
        const step = function (i) {
          if (i >= ids.length) {
            wx.hideLoading();
            that.setData({ batchOpen: false, picked: {}, pickedCount: 0, pickedPaid: 0 });
            wx.showToast({ title: '发了 ' + done + ' 单' + (failed ? '，' + failed + ' 单失败' : ''), icon: 'none' });
            that.load();
            return;
          }
          api.ship(ids[i], that.data.batchCompany, '').then(function (r) {
            if (r && r.ok) done++;
            else failed++;
            step(i + 1);
          }).catch(function () {
            failed++;
            step(i + 1);
          });
        };
        step(0);
      }
    });
  },

  /* ---------- 导出对账单 ---------- */
  /* 生成真的 .xlsx：两张表（明细 + 按月汇总）。
     为什么不再复制 CSV：CSV 进 Excel 会丢手机号前导零，中文有时乱码，
     而且做不了第二张汇总表。
     小程序里写文件用 wx.getFileSystemManager，写进 USER_DATA_PATH 再打开/转发。 */
  exportXlsx() {
    const raw = this.rawOrders || [];
    if (!raw.length) {
      wx.showToast({ title: '这一屏没有订单可导出', icon: 'none' });
      return;
    }
    const that = this;
    const head = ['订单号', '下单时间', '状态', '买家', '电话', '地址', '商品', '件数', '实付', '已退', '运单号'];
    const rows = [head];
    raw.forEach(function (o) {
      const d = new Date(o.createdAt || 0);
      const pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      rows.push([
        o.no || '',
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
          pad(d.getHours()) + ':' + pad(d.getMinutes()),
        (store.STATUS[o.status] || {}).text || o.status,
        o.address ? o.address.name : '到店自提',
        o.address ? String(o.address.phone) : '',
        o.address ? o.address.detail : '',
        (o.items || []).map(function (it) {
          return it.name + ' ' + it.color + '/' + it.size + '×' + it.qty;
        }).join('；'),
        (o.items || []).reduce(function (a, b) { return a + b.qty; }, 0),
        Number(o.amount) || 0,
        Number(o.refundedAmount) || 0,
        o.tracking ? o.tracking.company + ' ' + o.tracking.no : ''
      ]);
    });

    /* 汇总只算真付过钱的：取消/超时关掉的单不该进「实付合计」 */
    const months = X.byMonth(raw.filter(function (o) {
      return o.status !== 'cancelled';
    }));
    const sumRows = [['月份', '单数', '实付合计', '退款合计', '净额']];
    months.forEach(function (m) {
      sumRows.push([m.month, m.orders, Math.round(m.amount * 100) / 100, Math.round(m.refund * 100) / 100, Math.round(m.net * 100) / 100]);
    });

    let buf;
    try {
      buf = X.buildXlsx([
        { name: '明细', rows: rows },
        { name: '按月汇总', rows: sumRows }
      ]);
    } catch (e) {
      wx.showToast({ title: '生成表格失败', icon: 'none' });
      return;
    }

    const fs = wx.getFileSystemManager && wx.getFileSystemManager();
    if (!fs || !wx.env || !wx.env.USER_DATA_PATH) {
      /* 网页演示版没有文件系统，退回复制 CSV，至少能看 */
      that.exportCsv();
      return;
    }
    const d = new Date();
    const name = '对账单-' + d.getFullYear() + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1) +
      (d.getDate() < 10 ? '0' : '') + d.getDate() + '.xlsx';
    const filePath = wx.env.USER_DATA_PATH + '/' + name;
    fs.writeFile({
      filePath: filePath,
      data: buf.buffer,
      success() {
        wx.showToast({ title: '已生成 ' + rows.length - 1 + ' 行', icon: 'none' });
        if (wx.openDocument) {
          wx.openDocument({
            filePath: filePath,
            fileType: 'xlsx',
            showMenu: true,
            fail() {
              wx.showToast({ title: '文件在 ' + filePath, icon: 'none' });
            }
          });
        }
      },
      fail() {
        wx.showToast({ title: '写文件失败', icon: 'none' });
      }
    });
  },

  /* 复制成 CSV（网页演示版兜底；小程序里用不上） */
  exportCsv() {
    const rows = this.data.orders;
    if (!rows.length) {
      wx.showToast({ title: '这一屏没有订单可导出', icon: 'none' });
      return;
    }
    const esc = function (v) {
      const s = String(v === undefined || v === null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const head = ['订单号', '时间', '状态', '买家', '电话', '地址', '商品', '件数', '金额', '运单'];
    const lines = [head.join(',')];
    rows.forEach(function (o) {
      lines.push([
        o.no, o.timeText, o.statusText, o.buyer, o.phone, o.address,
        o.itemsText, o.qty, o.amountText, o.trackText
      ].map(esc).join(','));
    });
    wx.setClipboardData({
      data: lines.join('\n'),
      success() {
        wx.showToast({ title: '已复制 ' + rows.length + ' 行，粘到表格里就行', icon: 'none' });
      }
    });
  },

  /* ---------- 退货 ---------- */
  openReturn(e) {
    const id = e.currentTarget.dataset.id;
    /* 云端订单不在本地 store 里，优先用列表里带回来的原始对象 */
    const o = (this.rawMap || {})[id] || store.getOrder(id);
    if (!o) return;
    const doneIdx = (o.returnedItems || []).map(function (r) { return r.index; });
    const items = o.items.map(function (it, i) {
      return {
        index: i,
        name: it.name,
        spec: it.color + ' / ' + it.size,
        qty: it.qty,
        price: it.price,
        priceText: F.yuan(it.price * it.qty),
        returned: doneIdx.indexOf(i) >= 0,
        picked: doneIdx.indexOf(i) < 0
      };
    });
    this.setData({
      returnTarget: id,
      returnItems: items,
      returnReason: ''
    });
  },

  closeReturn() {
    this.setData({ returnTarget: null, returnItems: [] });
  },

  toggleReturnItem(e) {
    const i = Number(e.currentTarget.dataset.i);
    const items = this.data.returnItems.map(function (it, k) {
      if (k !== i || it.returned) return it;
      return Object.assign({}, it, { picked: !it.picked });
    });
    this.setData({ returnItems: items });
  },

  onReturnReason(e) {
    this.setData({ returnReason: e.detail.value });
  },

  doReturn() {
    const idx = this.data.returnItems.filter(function (it) {
      return it.picked && !it.returned;
    }).map(function (it) { return it.index; });
    if (!idx.length) {
      wx.showToast({ title: '先勾选要退的商品', icon: 'none' });
      return;
    }
    const that = this;
    api.returnHandle(this.data.returnTarget, idx, this.data.returnReason).then(function (r) {
      if (!r || !r.ok) {
        wx.showToast({ title: (r && r.msg) || '处理失败', icon: 'none' });
        return;
      }
      wx.showToast({ title: '已退 ¥' + F.yuan(r.refund), icon: 'none' });
      that.closeReturn();
      that.load();
    });
  },

  /* ---------- 商品维护 ---------- */
  toggleSale(e) {
    const id = e.currentTarget.dataset.id;
    const that = this;
    /* 直接信开关的新状态：云端商品不一定在本地 store 里，别拿本地当准 */
    const next = e.detail && typeof e.detail.value === 'boolean'
      ? e.detail.value
      : !(this.findProduct(id).onSale === false);
    api.updateProduct(id, { onSale: next }).then(function (r) {
      if (!r || !r.ok) {
        wx.showToast({ title: (r && r.msg) || '改不动', icon: 'none' });
        that.load();
        return;
      }
      wx.showToast({ title: next ? '已上架' : '已下架', icon: 'none' });
      that.load();
    });
  },

  /* 商品优先从当前这一屏（可能是云端的）里找，找不到再看本地 */
  findProduct(id) {
    const hit = (this.data.products || []).filter(function (p) {
      return p.id === id;
    })[0];
    return hit || store.getProduct(id) || {};
  },

  openEdit(e) {
    const id = e.currentTarget.dataset.id;
    const p = this.findProduct(id);
    if (!p) return;
    this.setData({
      editTarget: id,
      editName: p.name,
      editPrice: String(p.price),
      editStock: String(p.stock),
      editImage: p.image
    });
  },

  closeEdit() {
    this.setData({ editTarget: null });
  },

  onEditName(e) {
    this.setData({ editName: e.detail.value });
  },

  onEditPrice(e) {
    this.setData({ editPrice: e.detail.value });
  },

  onEditStock(e) {
    this.setData({ editStock: e.detail.value });
  },

  /* 店主自己拍实物图：拍完直接传到云存储，商品里存 fileID。
     为什么不存本地临时路径：tempFilePath 关掉小程序就失效，换台手机更看不到。 */
  uploadPhoto(e) {
    const id = e.currentTarget.dataset.id;
    const that = this;
    if (!wx.chooseMedia) {
      wx.showToast({ title: '演示版不支持选图，正式版可拍照上传', icon: 'none' });
      return;
    }
    if (!api.ready()) {
      wx.showToast({ title: '联网后才能换图（现在换只在当前手机有效）', icon: 'none' });
    }
    wx.chooseMedia({
      count: 1,
      mediaType: ['image'],
      sizeType: ['compressed'],
      success(res) {
        const f = res.tempFiles && res.tempFiles[0];
        if (!f) return;
        that.markUploading(id, true);
        api.uploadImage(f.tempFilePath, id).then(function (r) {
          if (!r || !r.ok) {
            that.markUploading(id, false);
            wx.showToast({ title: (r && r.msg) || '上传失败', icon: 'none' });
            return;
          }
          api.updateProduct(id, { image: r.fileID }).then(function (w) {
            that.markUploading(id, false);
            if (!w || !w.ok) {
              wx.showToast({ title: (w && w.msg) || '保存失败', icon: 'none' });
              return;
            }
            wx.showToast({ title: '图已换好', icon: 'none' });
            that.load();
          });
        });
      }
    });
  },

  markUploading(id, on) {
    const products = (this.data.products || []).map(function (p) {
      if (p.id !== id) return p;
      return Object.assign({}, p, { uploading: !!on });
    });
    this.setData({ products: products });
  },

  /* 店主自己拍实物图：接云开发后换成上传云存储拿 fileID */
  pickImage() {
    const that = this;
    if (!wx.chooseMedia) {
      wx.showToast({ title: '演示版不支持选图，正式版可拍照上传', icon: 'none' });
      return;
    }
    wx.chooseMedia({
      count: 1,
      mediaType: ['image'],
      sizeType: ['compressed'],
      success(res) {
        const f = res.tempFiles && res.tempFiles[0];
        if (f) that.setData({ editImage: f.tempFilePath });
      }
    });
  },

  doEdit() {
    const that = this;
    const id = this.data.editTarget;
    const patch = {
      name: this.data.editName,
      price: this.data.editPrice,
      stock: this.data.editStock
    };
    /* 只有云存储 fileID / 小程序自带图才回写；本地临时路径存进去是死链 */
    const img = this.data.editImage || '';
    if (/^cloud:\/\//.test(img) || /^\/images\//.test(img)) patch.image = img;
    api.updateProduct(id, patch).then(function (r) {
      if (!r || !r.ok) {
        wx.showToast({ title: (r && r.msg) || '保存失败', icon: 'none' });
        return;
      }
      wx.showToast({ title: '已保存' });
      that.closeEdit();
      that.load();
    });
  },

  /* ---------- 其它 ---------- */
  copyPhone(e) {
    wx.setClipboardData({ data: e.currentTarget.dataset.phone });
  },

  copyTrack(e) {
    const o = this.data.orders.filter(function (x) {
      return x.id === e.currentTarget.dataset.id;
    })[0];
    if (o) wx.setClipboardData({ data: o.trackText });
  },

  copyNo(e) {
    const o = this.data.orders.filter(function (x) {
      return x.id === e.currentTarget.dataset.id;
    })[0];
    if (o) wx.setClipboardData({ data: o.no });
  },

  demoAction() {
    if (this.data.hasDemo) {
      const that = this;
      wx.showModal({
        title: '清掉演示订单？',
        content: '只删除标了「演示」的订单，真实下单不受影响。',
        success(res) {
          if (!res.confirm) return;
          store.clearDemoOrders();
          that.load();
        }
      });
      return;
    }
    const n = store.seedDemoOrders();
    wx.showToast({ title: '已生成 ' + n + ' 笔演示订单', icon: 'none' });
    this.load();
  },

  exit() {
    getApp().globalData.adminUnlocked = false;
    wx.navigateBack();
  }
});

});
</script>
<script>
/* 浏览器端轻量运行时：把 WXML/WXSS/Page 配置渲染成 DOM（预览用，非小程序真机环境） */
/* 网页演示版运行时：在浏览器里模拟 wx / Page / Component，把真实 WXML 渲染成 DOM。
   只实现本项目用到的能力：wx:for、wx:if/elif/else、{{}}、bindtap/input/change、picker、switch。 */
(function () {
  'use strict';

  var PAGES = window.__PAGES__;
  var COMPONENTS = window.__COMPONENTS__;
  var MODULES = window.__MODULES__;
  var TABS = window.__TABS__;

  var moduleCache = {};
  function __req(id) {
    if (moduleCache[id]) return moduleCache[id].exports;
    var mod = { exports: {} };
    moduleCache[id] = mod;
    if (!MODULES[id]) throw new Error('missing module ' + id);
    MODULES[id](mod, mod.exports, __req);
    return mod.exports;
  }

  /* ---------------- storage ---------------- */
  var memory = {};
  var PREFIX = 'lanshi_web_';
  function lsGet(k) {
    try {
      var raw = localStorage.getItem(PREFIX + k);
      return raw === null ? '' : JSON.parse(raw);
    } catch (e) { return Object.prototype.hasOwnProperty.call(memory, k) ? memory[k] : ''; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { memory[k] = v; }
  }
  function lsDel(k) {
    try { localStorage.removeItem(PREFIX + k); } catch (e) { delete memory[k]; }
    delete memory[k];
  }

  /* ---------------- app ---------------- */
  var pendingCfg = null;
  var pendingKind = null;
  var app = {
    globalData: { statusBarHeight: 20, adminUnlocked: false, checkoutDraft: null, storePhone: '' },
    updateCartBadge: function () {
      try {
        var store = __req('utils/store');
        var n = store.cartCount();
        var badge = document.getElementById('cart-badge');
        if (badge) {
          badge.textContent = n > 99 ? '99+' : String(n);
          badge.style.display = n ? 'flex' : 'none';
        }
      } catch (e) { /* ignore */ }
    }
  };
  window.getApp = function () { return app; };
  window.App = function (cfg) {
    Object.assign(app, cfg);
    if (cfg.onLaunch) cfg.onLaunch.call(app);
    if (cfg.onShow) cfg.onShow.call(app);

      items: [{ productId: 'p4', color: '米白', size: 'S', qty: 1 }],
      delivery: 'pickup', usePoints: false
    }).order;
    store.payOrder(o3.id);
    store.ship(o3.id, '到店自提', '');
    store.confirmReceipt(o3.id);

    store.seedDemoOrders();
    lsSet('seeded4', 1);
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    phone = document.getElementById('phone') || document.body;
    screenEl = document.getElementById('phone') || document.body;
    rootEl = document.getElementById('root');
    console.log('[兰欧茜演示版] build 1.4.1（底部导航已修复）');
    bindEvents();

    var tabsHtml = TABS.map(function (t) {
      return '<div class="tab" data-tab="' + t.name + '"><img src="images/' + t.icon +
        '.png" data-icon="' + t.icon + '"><span>' + t.label + '</span>' +
        (t.name === 'cart' ? '<i id="cart-badge" class="badge"></i>' : '') + '</div>';
    }).join('');
    document.getElementById('tabbar').innerHTML = tabsHtml;

    var backBtn = document.getElementById('back');
    if (backBtn) backBtn.addEventListener('click', function () { goBack(); });
    var resetBtn = document.getElementById('reset');
    if (resetBtn) {
      resetBtn.addEventListener('click', function () {
        if (!window.confirm('清空演示数据？订单、积分、购物车都会回到初始状态。')) return;
        try { localStorage.clear(); } catch (e) {}
        location.hash = '#/home';
        location.reload();
      });
    }
    window.__reset = function () {
      try { localStorage.clear(); } catch (e) {}
      location.reload();
    };

    __req('app');

    pendingCfg = null;
    __req('components/product-card/index');
    var compCfg = pendingCfg || {};
    var compData = Object.assign({}, compCfg.data || {});
    Object.keys(compCfg.properties || {}).forEach(function (k) {
      var p = compCfg.properties[k];
      compData[k] = p && p.value !== undefined ? p.value : '';
    });
    COMPONENTS['product-card'] = {
      ast: window.__COMP_AST__,
      data: compData,
      methods: compCfg.methods || {}
    };

    seed();
    if (!location.hash) location.replace('#/home');
    window.addEventListener('hashchange', applyRoute);
    applyRoute();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body></html>
